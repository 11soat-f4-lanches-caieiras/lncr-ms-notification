#valores padrões para o Helm Chart

#ServiceAccount
serviceAccount:
  name: secrets-sa

#Aplicação
app:
  name: notification
  replicas: 1
  image:
    repository: ${AWS_ECR_REPOSITORY}
    tag: latest
    pullPolicy: Always
  port: 8080
  containerName: customer
  internalUrl: ${LNCR_INTERNAL_URL}
  externalUrl: ${LNCR_EXTERNAL_URL}

#Service
service:
  port: 80
  targetPort: 8080

#Ingress
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/load-balancer-name: "lncr-prd-int-alb"
    alb.ingress.kubernetes.io/group.name: "lncr-prd-internal"
    # As anotações abaixo serão definidas via --set-string na pipeline:
    # - alb.ingress.kubernetes.io/subnets
    # - alb.ingress.kubernetes.io/security-groups
  hosts:
  - paths:
    - path: /notifications
      pathType: Prefix
  tls: []


#Deployment
resources:
  pods:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

#HPA
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 85

#SecretProviderClass
secretProviderClass:
  name: "lncr-ms-notification-prd-secrets"
  namespace: production
  provider: aws
  parameters:
    region: "us-east-1"
    objects:
      - objectName: ${ AWS_SECRET_MANAGER_ARN }
        objectType: secretsmanager
  keys:
    - POSTGRES_URL
    - POSTGRES_USER
    - POSTGRES_PASSWORD
  secretObjects:
    - secretName: notification-secret
      type: Opaque
  twoSecrets:
    enabled: false
deploySecretName: notification-secret
